name: AC garrafa monitor

on:
  schedule:
        - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ac-garrafa-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Poll and act
        working-directory: scripts
        env:
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          SHELLY_SERVER_URI: ${{ secrets.SHELLY_SERVER_URI }}
          SHELLY_DEVICE_ID: ${{ secrets.SHELLY_DEVICE_ID }}
          MELCLOUD_EMAIL: ${{ secrets.MELCLOUD_EMAIL }}
          MELCLOUD_PASSWORD: ${{ secrets.MELCLOUD_PASSWORD }}
        run: python monitor.py
